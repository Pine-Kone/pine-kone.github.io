<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pigeon Pie | Writings</title>
  <link rel="stylesheet" href="/style/main.css" />
  <style>
    .story-wrapper {
      max-width: 750px;
      margin: 3rem auto;
      padding: 2rem;
      background-color: var(--background-color);
      color: var(--text-color);
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      line-height: 1.6;
    }

    .story-wrapper h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .story-text {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
    <header data-site-header data-title="Pigeon Pie"></header>

  <section class="story-wrapper">
    <h2>Pigeon Pie</h2>
    <div class="story-text">
      <p>
Here I sit upon this bench
Letting time pass by
When something hit me like a wrench
It was a pigeon pie...
      </p>
    </div>
  </section>

    <footer data-site-footer></footer>

  <button id="theme-toggle" aria-label="Toggle light/dark mode">🌓</button>
  <script src="/scripts/light-dark-toggle.js"></script>
  <script src="/scripts/site-chrome.js"></script>
</body>
</html>
