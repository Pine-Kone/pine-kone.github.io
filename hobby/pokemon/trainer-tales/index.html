<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Trainer Tales | Hans M. Haroldsen</title>

  <link rel="stylesheet" href="/style/main.css" />
  <link rel="stylesheet" href="/style/hobby/pokemon/trainer-tales/trainer-tales.css" />
</head>

<body>

    <header data-site-header data-title="Trainer Tales"></header>


  <main>

    <section class="tales-hero">
      <h2>Trainer Tales</h2>
      <p>
        Stories from my time with Pokémon - favorite pulls, hunts that
        paid off, cards with history, and whatever else is worth
        telling.
      </p>
    </section>


    <section class="tales-list-section">

      <div class="tales-grid">

        <!--
          Copy /hobby/pokemon/trainer-tales/_template/template.html
          for each new tale, then add a matching card here. The card's
          <p class="tale-excerpt"> should be a short 1-2 sentence teaser,
          not the whole story.
        -->

        <a href="_template/" class="tale-card">
          <span class="tale-date">Month Year</span>
          <h3>Example Tale Title</h3>
          <p class="tale-excerpt">
            A one or two sentence teaser for the story goes here -
            replace this card once your first real tale is written.
          </p>
        </a>

      </div>

    </section>

  </main>


    <footer data-site-footer></footer>

  <button id="theme-toggle" aria-label="Toggle light/dark mode">🌓</button>

  <script src="/scripts/light-dark-toggle.js"></script>

  <script src="/scripts/site-chrome.js"></script>
</body>
</html>
