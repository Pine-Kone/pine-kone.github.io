<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jolteon Collection | Hans M. Haroldsen</title>

  <link rel="stylesheet" href="/style/main.css" />

  <style>
    /* ================================
       Page Header
       ================================ */

    .collection-hero {
      padding: 3rem 1rem 2rem;
      text-align: center;
      background: var(--background-color);
    }

    .collection-hero h2 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .collection-hero p {
      max-width: 700px;
      margin: 0 auto;
    }


    /* ================================
       Collection Summary
       ================================ */

    .collection-summary {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem;
      background: #f0f0f0;
    }

    body.dark-mode .collection-summary {
      background: #2a2a2a;
    }

    .summary-card {
      min-width: 150px;
      padding: 1rem 1.5rem;
      background: var(--background-color);
      border-radius: 0.75rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .summary-number {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    body.dark-mode .summary-number {
      color: var(--accent-color);
    }

    .summary-label {
      font-size: 0.9rem;
    }


    /* ================================
       Card Collection
       ================================ */

    .collection-section {
      padding: 2rem 1rem 4rem;
      background: #f0f0f0;
    }

    body.dark-mode .collection-section {
      background: #2a2a2a;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }


    /* ================================
       Individual Card
       ================================ */

    .tcg-card {
      background: var(--background-color);
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .tcg-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    }

    .tcg-card.obtained {
      border: 3px solid #4caf50;
    }

    .tcg-card.not-obtained {
      border: 3px solid #d9534f;
    }


    /* ================================
       Card Image
       ================================ */

    .card-image-wrapper {
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eeeeee;
      border-radius: 0.5rem;
      overflow: hidden;
    }

    body.dark-mode .card-image-wrapper {
      background: #1e1e1e;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-image-placeholder {
      text-align: center;
      padding: 1rem;
      color: #777;
    }


    /* ================================
       Card Information
       ================================ */

    .card-info {
      padding-top: 1rem;
    }

    .card-name {
      margin: 0;
      font-size: 1.25rem;
    }

    .card-set {
      margin: 0.25rem 0;
      font-weight: bold;
      color: var(--primary-color);
    }

    body.dark-mode .card-set {
      color: var(--accent-color);
    }

    .card-number {
      margin: 0.25rem 0;
      font-size: 0.95rem;
    }


    /* ================================
       Ownership Status
       ================================ */

    .ownership-status {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .status-obtained {
      background: #d9f2dc;
      color: #236b2c;
    }

    .status-not-obtained {
      background: #f8dddd;
      color: #8a2525;
    }

    body.dark-mode .status-obtained {
      background: #244d2a;
      color: #b9efc0;
    }

    body.dark-mode .status-not-obtained {
      background: #542727;
      color: #ffbcbc;
    }


    /* ================================
       Acquisition Information
       ================================ */

    .acquisition-info {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #ddd;
      font-size: 0.9rem;
    }

    body.dark-mode .acquisition-info {
      border-top-color: #555;
    }

    .acquisition-info p {
      margin: 0.3rem 0;
    }

    .acquisition-label {
      font-weight: bold;
    }


    /* ================================
       Mobile Adjustments
       ================================ */

    @media (max-width: 600px) {

      .collection-hero h2 {
        font-size: 2rem;
      }

      .collection-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .tcg-card {
        padding: 0.6rem;
      }

      .card-name {
        font-size: 1rem;
      }

      .card-set,
      .card-number {
        font-size: 0.85rem;
      }

      .ownership-status {
        font-size: 0.75rem;
      }

    }
  </style>
</head>

<body>

  <header>
    <h1>Jolteon Collection</h1>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/hobby/">Hobbies</a></li>
        <li><a href="/hobby/pokemon/">Pokémon</a></li>
        <li><a href="/hobby/pokemon/chase-list/">Chase List</a></li>
      </ul>
    </nav>
  </header>


  <main>

    <section class="collection-hero">
      <h2>⚡ Jolteon ⚡</h2>

      <p>
        My current quest to collect the Jolteon cards
        on my chase list.
      </p>
    </section>


    <section class="collection-summary">

      <div class="summary-card">
        <span class="summary-number" id="total-cards">0</span>
        <span class="summary-label">Total Cards</span>
      </div>

      <div class="summary-card">
        <span class="summary-number" id="obtained-cards">0</span>
        <span class="summary-label">Obtained</span>
      </div>

      <div class="summary-card">
        <span class="summary-number" id="remaining-cards">0</span>
        <span class="summary-label">Still Chasing</span>
      </div>

      <div class="summary-card">
        <span class="summary-number" id="completion-percent">0%</span>
        <span class="summary-label">Complete</span>
      </div>

    </section>


    <section class="collection-section">

      <div class="collection-grid" id="card-grid">
        <!-- Cards are generated by jolteon.js -->
      </div>

    </section>

  </main>


  <footer>
    <p>© 2026 Hans M. Haroldsen</p>
  </footer>


  <button
    id="theme-toggle"
    aria-label="Toggle light/dark mode">
    🌓
  </button>


  <script src="/scripts/light-dark-toggle.js"></script>
  <script src="jolteon.js"></script>

</body>
</html>
