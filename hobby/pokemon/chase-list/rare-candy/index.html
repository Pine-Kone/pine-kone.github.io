<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rare Candy Collection | Hans M. Haroldsen</title>

  <link rel="stylesheet" href="/style/main.css" />
  <link rel="stylesheet" href="/style/hobby/pokemon/chase-list/chase-list.css" />
</head>

<body>

  <header>
    <h1>Rare Candy Collection</h1>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/hobby/">Hobbies</a></li>
        <li><a href="/hobby/pokemon/">Pokémon</a></li>
        <li><a href="/hobby/pokemon/chase-list/">Chase List</a></li>
      </ul>
    </nav>
  </header>


  <main>

    <section class="collection-hero">
      <h2>Rare Candy</h2>
      <p>
        Every English-language (and un-translated Japanese) Rare Candy
        Trainer card printed, and how close I am to owning them all.
      </p>
    </section>


    <section class="collection-stats">

      <div class="stat-card">
        <span class="stat-value" id="total-cards">0</span>
        <span class="stat-label">Total Cards</span>
      </div>

      <div class="stat-card">
        <span class="stat-value" id="obtained-cards">0</span>
        <span class="stat-label">Obtained</span>
      </div>

      <div class="stat-card">
        <span class="stat-value" id="remaining-cards">0</span>
        <span class="stat-label">Still Chasing</span>
      </div>

      <div class="stat-card">
        <span class="stat-value" id="completion-percent">0%</span>
        <span class="stat-label">Complete</span>
      </div>

    </section>


    <section class="collection-controls">
      <label for="collection-filter">Show:</label>
      <select id="collection-filter">
        <option value="all">All Cards</option>
        <option value="obtained">Obtained</option>
        <option value="chasing">Still Chasing</option>
      </select>
    </section>


    <section class="collection-section">
      <div class="collection-grid" id="card-grid">
        <!-- Cards are generated by rare-candy.js -->
      </div>
    </section>

  </main>


  <footer>
    <p>© 2026 Hans M. Haroldsen</p>
  </footer>


  <button id="theme-toggle" aria-label="Toggle light/dark mode">🌓</button>

  <script src="/scripts/light-dark-toggle.js"></script>
  <script src="/scripts/hobby/pokemon/chase-list/chase-list-common.js"></script>
  <script src="rare-candy.js"></script>

</body>
</html>
