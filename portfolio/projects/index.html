<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Hans M. Haroldsen</title>
  <link rel="stylesheet" href="/style/main.css" />
</head>
<body>
  <header data-site-header data-title="Portfolio" data-nav="breadcrumb" data-back-href="/portfolio/" data-back-label="My Career"></header>

  <section class="hero">
    <h2>My Portfolio</h2>
    <p class="hero-blurb">
      A mix of professional projects, school work, data & analytics builds, and code snippets.
      Filter by tool to find what you're looking for.
    </p>
    <div id="tool-chips" class="category-chips portfolio-tool-chips"></div>
  </section>

  <div id="portfolio-items"></div>

  <section class="explore">
    <h3>See Also</h3>
    <div class="info-card-grid">
      <a href="/hobby/shortcuts/" class="info-card">
        <span class="info-card-icon">⚙️</span>
        <h3>All Shortcuts</h3>
        <p>The full list of iOS Shortcuts I use, professional and personal.</p>
      </a>
    </div>
  </section>

  <footer data-site-footer></footer>

  <button id="theme-toggle" aria-label="Toggle light/dark mode">🌓</button>
  <script src="/scripts/light-dark-toggle.js"></script>
  <script src="/scripts/site-chrome.js"></script>
  <script src="/scripts/portfolio/portfolio-items-data.js"></script>
  <script src="/scripts/portfolio/portfolio-items.js"></script>
</body>
</html>
